name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate release tag and source
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" main
          tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          main_sha="$(git rev-parse origin/main^{commit})"
          test "$GITHUB_SHA" = "$tag_sha"
          test "$(git rev-parse HEAD^{commit})" = "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" "$main_sha"
          version="$(awk -F'"' '/^export const AIDLC_VERSION = "/ { print $2 }' core/tools/aidlc-version.ts)"
          test "$RELEASE_TAG" = "v$version"
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$tag_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            directory: linux-x64
          - runner: ubuntu-latest
            target: bun-linux-x64-musl
            directory: linux-x64-musl
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            directory: linux-arm64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64-musl
            directory: linux-arm64-musl
          - runner: macos-15-intel
            target: bun-darwin-x64
            directory: darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            directory: darwin-arm64
          - runner: windows-latest
            target: bun-windows-x64
            directory: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Build from projections regenerated on this runner, never from the
      # committed trees; the --check that follows is the generator-determinism
      # guard (regen twice, byte-compare), not a staleness check.
      - run: bun scripts/package.ts
      - run: bun scripts/package.ts --check
      - run: bun scripts/build-binaries.ts --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            build/binaries/${{ matrix.directory }}
            build/binaries/build-results-${{ matrix.directory }}.json

  stage-release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: build/binaries
          merge-multiple: true
      - run: bun scripts/package.ts
      - run: bun scripts/package-release.ts --require-release-matrix
        env:
          AIDLC_RELEASE_SOURCE_DIGEST: ${{ needs.validate.outputs.sha }}
      - name: Re-verify staged release checksums
        working-directory: build/release
        run: sha256sum -c checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: build/release

  publish:
    needs: [validate, stage-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ needs.validate.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Recheck release source
        env:
          AUTHORIZED_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$AUTHORIZED_SHA"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: build/release
      - run: test "$RELEASE_TAG" = "v$(jq -r .version build/release/version.json)"
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      - name: Re-verify staged release checksums
        working-directory: build/release
        run: sha256sum -c checksums.txt
      - name: Attest staged release assets
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/release/*
      - name: Stage offline provenance bundle
        run: |
          test -f "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" build/release/aidlc-release.intoto.jsonl
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
      - name: Validate complete attested release candidate
        run: |
          bun scripts/verify-release.ts candidate \
            --directory build/release \
            --tag "$RELEASE_TAG" \
            --source-digest "$AUTHORIZED_SHA"
        env:
          AUTHORIZED_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-release
          path: build/release
          if-no-files-found: error

  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: attested-release
          path: build/release
      - name: Recheck release source
        env:
          AUTHORIZED_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$AUTHORIZED_SHA"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"
          test "$RELEASE_TAG" = "v$(jq -r .version build/release/version.json)"
          (cd build/release && sha256sum -c checksums.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" build/release/* \
            --verify-tag \
            --title "AI-DLC ${RELEASE_TAG#v}" \
            --generate-notes
      - name: Verify uploaded asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          find build/release -mindepth 1 -maxdepth 1 -type f -exec basename {} \; |
            LC_ALL=C sort >"$RUNNER_TEMP/local-assets.txt"
          gh release view "$RELEASE_TAG" --json assets --jq ".assets[].name" |
            LC_ALL=C sort >"$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt"
